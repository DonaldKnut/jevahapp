<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="./src/assets/logos/jevah_favicon.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Jevah — Gospel music, Bible, and Christian community app</title>
    <meta
      name="description"
      content="Jevah is the gospel app for faith: stream worship and Afro-gospel, read the Holy Bible, hear sermons, and grow with a Christian community. Free on web and mobile."
    />
    <meta
      name="keywords"
      content="Jevah, gospel music app, Christian app, Bible app, gospel songs, worship music, Christian community, faith, sermons, Nigerian gospel, Afro gospel"
    />
    <link rel="canonical" href="https://www.jevahapp.com/" />
    <meta property="og:site_name" content="Jevah" />
    <meta property="og:title" content="Jevah — Gospel music, Bible, and Christian community app" />
    <meta
      property="og:description"
      content="Jevah is the gospel app for faith: stream worship and Afro-gospel, read the Holy Bible, hear sermons, and grow with a Christian community."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.jevahapp.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jevah — Gospel music, Bible, and Christian community app" />
    <meta
      name="twitter:description"
      content="Gospel music, Holy Bible, sermons, and Christian community — the Jevah app."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Jevah",
            "url": "https://www.jevahapp.com",
            "email": "support@jevahapp.com"
          },
          {
            "@type": "WebSite",
            "name": "Jevah",
            "url": "https://www.jevahapp.com",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://www.jevahapp.com/bible/search?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "SoftwareApplication",
            "name": "Jevah",
            "applicationCategory": "LifestyleApplication",
            "operatingSystem": "Android, iOS, Web",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "description": "Gospel music, Holy Bible, sermons, and a Christian community app."
          }
        ]
      }
    </script>
    <script>
      (function () {
        var key = "jevah-theme";
        var stored = localStorage.getItem(key);
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
